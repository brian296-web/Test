
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #10110f;
    overflow-x: hidden;
  }

  .medium.row {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1000px;
  }

  .square {
    width: 220px;
    height: 220px;
    border-radius: 24px;
    background: linear-gradient(135deg, #e4fd97, #2d3e2c);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    transform-style: preserve-3d;
    will-change: transform;
  }

  #css-selector-id {
    background: linear-gradient(135deg, #f0ffd0, #8ab45e, #17291e);
  }

  .medium.row:nth-of-type(3) .square {
    background: linear-gradient(135deg, #e4fd97, #718f56, #17291e);
  }
</style>

<div class="medium row">
  <div class="square"></div>
</div>

<div class="medium row">
  <div id="css-selector-id" class="square"></div>
</div>

<div class="medium row">
  <div class="square"></div>
</div>

<script>
  const rows = document.querySelectorAll(".medium.row");
  const squares = document.querySelectorAll(".square");

  function updateAnimation() {
    const viewportHeight = window.innerHeight;

    squares.forEach((square, index) => {
      const rect = rows[index].getBoundingClientRect();

      // Progress changes as the section crosses the viewport
      const progress =
        (viewportHeight - rect.top) /
        (viewportHeight + rect.height);

      const p = Math.max(0, Math.min(1, progress));
      const angle = (p - 0.5) * 2;

      // Large, visible 3D movement
      const rotateX = angle * 55;
      const rotateY = Math.sin(p * Math.PI * 2) * 55;
      const rotateZ = angle * 25;
      const moveZ = Math.sin(p * Math.PI) * 180;
      const moveY = angle * -100;
      const scale = 0.65 + Math.sin(p * Math.PI) * 0.5;

      square.style.transform = `
        translate3d(0, ${moveY}px, ${moveZ}px)
        rotateX(${rotateX}deg)
        rotateY(${rotateY}deg)
        rotateZ(${rotateZ}deg)
        scale(${scale})
      `;
    });
  }

  let framePending = false;

  function onScroll() {
    if (!framePending) {
      framePending = true;

      requestAnimationFrame(() => {
        updateAnimation();
        framePending = false;
      });
    }
  }

  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);

  updateAnimation();
</script>
